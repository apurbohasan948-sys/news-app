name: Automated Editorial Pipeline Dispatcher

on:
  schedule:
    # Run hourly on business hours
    - cron: '0 8-22 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'News Category'
        required: true
        default: 'TECHNOLOGY'
        type: choice
        options:
          - TECHNOLOGY
          - BUSINESS
          - SCIENCE
          - HEALTH
          - POLITICS
          - ENTERTAINMENT
      custom_topic:
        description: 'Optional custom topic to research'
        required: false
        type: string

jobs:
  dispatch-editorial-pipeline:
    name: Run Automated Research & Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        run: |
          echo "Editorial dispatch triggered for category: ${{ inputs.category || 'TECHNOLOGY' }}"
          echo "Autonomous newsroom operational."
